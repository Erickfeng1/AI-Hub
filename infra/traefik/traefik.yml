# Traefik 静态配置（v3）
# 安全默认：providers.docker.exposedByDefault=false —— 只有显式带 traefik.enable=true
# 标签的容器（即中台发布的应用）才会被路由，同网络里的其他容器不会意外暴露。

api:
  dashboard: true
  # 仪表盘仅监听容器内 8080，未发布到宿主；本地可用 docker 网络访问，生产建议关闭

entryPoints:
  web:
    address: :80
  websecure:
    address: :443

providers:
  docker:
    exposedByDefault: false
    network: hub-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

# 访问日志留痕（与中台审计日志互补：网关层记录每个应用子域名的访问）
accessLog: {}

# Let's Encrypt 证书解析器。
# 使用方式：infra/.env 填 ACME_EMAIL，并设 HUB_TLS_CERT_RESOLVER=le，
# 中台发布应用时会自动给容器打 tls.certresolver=le 标签（80 跳 443 一并生效）。
# 不设置时应用仅走 HTTP，适合本地开发。邮箱为空且无应用引用该解析器，不影响启动。
#
# ⚠ 关于 email 字段：Traefik 不会把 traefik.yml 里的 test@test.com 当环境变量替换
# （实测容器内读到的是字面量 "test@test.com"，LE 报 unable to parse email address）。
# 因此这个值必须由 infra/deploy.sh 在部署时**渲染成真实邮箱写进本文件**。
# 见 deploy.sh 的"渲染 traefik.yml"一步；本地手改后重启容器要 --force-recreate，
# 否则 compose 认为配置未变、不会真正重建容器。
#
# ⚠ 关于挑战方式：默认 tlsChallenge（TLS-ALPN-01）要求 LE 能直达 443 并完成
# acme-tls/1 ALPN 握手。若服务器前置有云厂商 SSL 卸载/高防网关（握手阶段即被 RST，
# 表现为 acme:error:connection :: Connection reset by peer），改用 httpChallenge：
#   httpChallenge:
#     entryPoint: web
# 此时需保证 80 端口的 /.well-known/acme-challenge/ 能转发到 Traefik
# （nginx 反代场景见 infra/nginx-ai-hub.conf）。
certificatesResolvers:
  le:
    acme:
      email: fengzhejun@163.com
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
