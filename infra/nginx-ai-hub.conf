# 企业 AI 中台 · 前置 nginx 反代配置（1Panel / OpenResty 站点用）
#
# 适用场景：服务器上已有 nginx 占着 80/443（这台机器跑着 1Panel + WordPress），
# 中台的 Traefik 网关被挪到 8000(HTTP)/443(TLS)。本文件负责：
#   1. 把 80 端口的 /.well-known/acme-challenge/ 透传给 Traefik（HTTP-01 证书验证）
#   2. 把其余 80 流量跳转到 https
#   3. 443 反代到 Traefik 8000（若 Traefik 未独占 443）或直接透传（若独占 443）
#
# 安装方式（二选一）：
#   A. 1Panel 面板：网站 → 反向代理 → 新建，按下面 location 逐条添加
#   B. 命令行：把本文件拷到 1Panel 的 conf.d 后 reload
#        cp nginx-ai-hub.conf /opt/1panel/apps/openresty/openresty/conf/conf.d/
#        nginx -t && systemctl reload nginx
#
# ⚠ 关键：proxy_set_header Host $host 必须保留。
#    中台的应用是独立子域名（<slug>.unilink.icu），Traefik 完全靠 Host 头
#    判断该转发给哪个容器。丢掉这个头，所有应用请求都会打到门户上。

# --------------------------------------------------------------- 80 端口
server {
    listen 80;
    listen [::]:80;
    server_name unilink.icu *.unilink.icu;

    # ACME HTTP-01 挑战必须透传给 Traefik（它持有 ACME 客户端与存储）。
    # 放在最前面且用精确前缀匹配，优先级高于下面的 "/"。
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余流量统一跳 HTTPS（证书签发成功后生效）
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------- 443 端口
# 情况一：Traefik 独占 443（当前部署形态，--gateway-tls-port 443）
#   → 不需要本 server 块，Traefik 自己监听 443。删掉下面整块即可。
#
# 情况二：443 被别的服务占着，Traefik 挪到 8443
#   → 启用本 server 块，把 443 反代到 Traefik 的 8443。
#     注意此时证书由前置 nginx 持有，Traefik 侧只需 http；且 Traefik 的
#     hub.yml 要把 rule 改成同时匹配 http（或由 nginx 做 SSL 终结）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unilink.icu *.unilink.icu;

    # 证书路径：用 certbot 或 Traefik 签好后填这里（情况二才需要）
    # ssl_certificate     /etc/nginx/ssl/unilink.icu.crt;
    # ssl_certificate_key /etc/nginx/ssl/unilink.icu.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # —— 以下四个头是子域名路由 + forwardAuth 的命门，一个都不能少 ——
        proxy_set_header Host $host;                  # Traefik 靠它区分应用
        proxy_set_header X-Forwarded-Proto https;     # forwardAuth 判定协议
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket / SSE（MCP 长连接、应用实时推送）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;      # SSE 流式响应不能缓冲
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
